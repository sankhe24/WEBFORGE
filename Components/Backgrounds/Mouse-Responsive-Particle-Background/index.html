<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>/* ---- reset ---- */
    body {
        margin: 0;
        font: normal 75% Arial, Helvetica, sans-serif;
    }
    
    canvas {
        display: block;
        vertical-align: bottom;
    }
    
    /* ---- tsparticles container ---- */
    #tsparticles {
        position: absolute;
        width: 100%;
        height: 100%;
    }
    
    .github {
        bottom: 10px;
        right: 10px;
        position: fixed;
        border-radius: 10px;
        background: #fff;
        padding: 0 12px 6px 12px;
        border: 1px solid #000;
    }
    
    .github a:hover,
    .github a:link,
    .github a:visited,
    .github a:active {
        color: #000;
        text-decoration: none;
    }
    
    .github img {
        height: 30px;
    }
    
    .github #gh-project {
        font-size: 20px;
        padding-left: 5px;
        font-weight: bold;
        vertical-align: bottom;
    }</style>    <title>Mouse Responsive Particle Background</title>
</head>

<body>
    <!-- tsParticles container -->
    <div id="tsparticles"></div>

    <script async="" defer="" src="https://buttons.github.io/buttons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.0/tsparticles.bundle.min.js"></script>
    <script type="text/javascript">
    tsParticles.load({
        id: "tsparticles",
        options: {
            fpsLimit: 60,
            particles: {
                number: {
                    value: 80
                },
                color: {
                    value: "#ff0000",
                    animation: {
                        enable: true,
                        speed: 20,
                        sync: true
                    }
                },
                shape: {
                    type: "circle"
                },
                opacity: {
                    value: 0.5
                },
                size: {
                    value: { min: 1, max: 3 }
                },
                links: {
                    enable: true,
                    distance: 100,
                    color: "random",
                    opacity: 0.4,
                    width: 1,
                    triangles: {
                        enable: true,
                        color: "#ffffff",
                        opacity: 0.1
                    }
                },
                move: {
                    enable: true,
                    speed: 6,
                    direction: "none",
                    outModes: "out"
                }
            },
            interactivity: {
                events: {
                    onHover: {
                        enable: true,
                        mode: "repulse"
                    },
                    onClick: {
                        enable: true,
                        mode: "push"
                    }
                },
                modes: {
                    repulse: {
                        distance: 200
                    },
                    push: {
                        quantity: 4
                    }
                }
            },
            background: {
                color: "#000000"
            }
        }
    });
    </script>
</body>

</html>
