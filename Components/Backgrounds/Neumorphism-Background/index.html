<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
}

.neu-background {
    background: #f0f0f0;
    box-shadow: 10px 10px 20px #cbced1, -10px -10px 20px #ffffff;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    width: 80%;
    height: 60%;
}

.neu-heading {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 110px;
}

.neu-subheading {
    font-size: 18px;
    color: #555;
    margin-bottom: 20px;
}

.neu-cta-button {
    background: #f0f0f0;
    box-shadow: 10px 10px 20px #cbced1, -10px -10px 20px #ffffff;
    border: none;
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 10px;
    outline: none;
    transition: box-shadow 0.3s ease;
}

.neu-cta-button:hover {
    box-shadow: 5px 5px 10px #cbced1, -5px -5px 10px #ffffff;
}</style>    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <title>Neumorphism Background</title>
</head>

<body>
    <div class="neu-background">
        <h1 class="neu-heading">Neumorphism Landing Page</h1>
        <p class="neu-subheading">Experience the Neumorphism Design</p>
        <button class="neu-cta-button">Click Me</button>
    </div>
</body>

</html>
