<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body,
    html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    
    #background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #2c3e50;
        pointer-events: none;
    }
    
    .raindrop {
        position: absolute;
        background-color: #77aaff;
        border-radius: 50%;
        pointer-events: none;
        animation: fall linear infinite;
    }
    
    @keyframes fall {
        0% {
            transform: translateY(-100px);
            opacity: 0;
        }
    
        50% {
            opacity: 1;
        }
    
        100% {
            transform: translateY(calc(100vh + 100px));
            opacity: 0;
        }
    }</style>    <title>Raindrop Ripple Background</title>
</head>

<body>
    <div id="background"></div>
    <script type="text/javascript">document.addEventListener('DOMContentLoaded', function () {
        const numDrops = 50;
        const bg = document.getElementById('background');
    
        for (let i = 0; i < numDrops; i++) {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            bg.appendChild(drop);
    
            const size = Math.random() * 10 + 2; // Random size between 2 and 12 px
            const duration = Math.random() * 2 + 1; // Random duration between 1 and 3 seconds
            const delay = Math.random() * 5; // Random delay between 0 and 5 seconds
            const x = Math.random() * window.innerWidth; // Random horizontal position
            const y = -Math.random() * window.innerHeight; // Start above viewport
    
            // Applying drop properties
            drop.style.width = `${size}px`;
            drop.style.height = `${size}px`;
            drop.style.left = `${x}px`;
            drop.style.animationDuration = `${duration}s`;
            drop.style.animationDelay = `${delay}s`;
    
            // Removing drop after animation
            drop.addEventListener('animationend', function () {
                drop.remove();
            });
        }
    });
    </script>
</body>

</html>
